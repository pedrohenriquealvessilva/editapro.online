<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CurrículoX — Seu currículo profissional em minutos, feito por IA</title>
<meta name="description" content="Responda perguntas simples e receba um currículo profissional criado por inteligência artificial. Sem login, sem enrolação.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">

<style>
/* =============================================================
   CurrículoX — Design System
   Tokens do briefing:
   Azul primário #2563EB · Fundo #F8FAFC · Texto #111827 · Sucesso #22C55E
   Inspiração: Linear, Stripe, Apple, Vercel, Notion
   ============================================================= */

:root{
  --color-primary: #2563EB;
  --color-primary-dark: #1D4ED8;
  --color-primary-light: #EFF4FF;
  --color-bg: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-text: #111827;
  --color-text-muted: #6B7280;
  --color-text-soft: #9CA3AF;
  --color-border: #E5E9F0;
  --color-success: #22C55E;
  --color-success-light: #ECFDF3;

  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Source Serif 4', Georgia, serif;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 999px;

  --shadow-sm: 0 1px 2px rgba(17,24,39,0.04), 0 1px 1px rgba(17,24,39,0.03);
  --shadow-md: 0 4px 16px rgba(17,24,39,0.06), 0 1px 3px rgba(17,24,39,0.04);
  --shadow-lg: 0 20px 48px rgba(17,24,39,0.10), 0 4px 12px rgba(17,24,39,0.05);
  --shadow-primary: 0 8px 24px rgba(37,99,235,0.24);

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --container-w: 1120px;
}

*, *::before, *::after{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  font-family: var(--font-body);
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
}
h1,h2,h3{ margin:0; font-weight:800; letter-spacing:-0.02em; line-height:1.15; }
p{ margin:0; color: var(--color-text-muted); }
ul{ list-style:none; margin:0; padding:0; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input, select, textarea{ font-family:inherit; font-size:15px; }
:focus-visible{ outline:2px solid var(--color-primary); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}

.container{ max-width: var(--container-w); margin:0 auto; padding:0 24px; }

.bg-grid{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    radial-gradient(circle at 15% 8%, rgba(37,99,235,0.06), transparent 45%),
    radial-gradient(circle at 85% 0%, rgba(37,99,235,0.05), transparent 40%);
}

.text-accent{ color: var(--color-primary); }

/* =============================================================
   Screens (SPA sections)
   ============================================================= */
.screen{ display:none; min-height:100vh; }
.screen--active{ display:block; animation: screenIn .35s var(--ease); }
@keyframes screenIn{ from{ opacity:0; } to{ opacity:1; } }

/* =============================================================
   Buttons
   ============================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius: var(--radius-sm);
  font-weight:600; font-size:15px;
  padding:12px 22px;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
  white-space:nowrap;
}
.btn:active{ transform: scale(0.97); }
.btn--primary{ background: var(--color-primary); color:#fff; box-shadow: var(--shadow-primary); }
.btn--primary:hover{ background: var(--color-primary-dark); box-shadow: 0 10px 28px rgba(37,99,235,0.32); transform: translateY(-1px); }
.btn--secondary{ background:#fff; color: var(--color-text); border:1px solid var(--color-border); }
.btn--secondary:hover{ border-color:#C7D2E5; background:#FBFCFE; }
.btn--ghost{ background:transparent; color: var(--color-text-muted); }
.btn--ghost:hover{ color: var(--color-text); }
.btn--sm{ padding:9px 16px; font-size:14px; }
.btn--lg{ padding:15px 28px; font-size:16px; border-radius: var(--radius-sm); }
.btn--block{ width:100%; }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none !important; }
.btn--loading{ position:relative; color:transparent !important; pointer-events:none; }
.btn--loading::after{
  content:""; position:absolute; width:16px; height:16px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; animation: spin .7s linear infinite;
}
.btn--secondary.btn--loading::after{ border-color: rgba(17,24,39,0.2); border-top-color: var(--color-text); }

/* =============================================================
   Navigation
   ============================================================= */
.nav{ position:sticky; top:0; z-index:40; backdrop-filter: blur(10px); background: rgba(248,250,252,0.75); border-bottom:1px solid var(--color-border); }
.nav__inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
.nav__logo{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:-0.01em; }
.nav__logo--sm{ font-size:16px; }
.nav__logo-mark{
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; border-radius:9px;
  background: linear-gradient(135deg, var(--color-primary), #4F83F1);
  color:#fff; font-weight:800; font-size:15px;
}
.nav__links{ display:flex; gap:28px; font-size:14px; font-weight:500; color: var(--color-text-muted); }
.nav__links a:hover{ color: var(--color-text); }
@media (max-width:760px){ .nav__links{ display:none; } }

/* =============================================================
   Hero
   ============================================================= */
.hero{ padding:88px 24px 40px; text-align:center; display:flex; flex-direction:column; align-items:center; }
.hero__eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-size:13px; font-weight:600; color: var(--color-primary);
  background: var(--color-primary-light); padding:7px 14px; border-radius: var(--radius-full);
  margin-bottom:24px;
}
.dot{ width:6px; height:6px; border-radius:50%; background: var(--color-primary); }
.hero__title{ font-size: clamp(34px, 5.5vw, 64px); max-width:820px; }
.hero__subtitle{ margin-top:22px; font-size:18px; max-width:600px; color: var(--color-text-muted); }
.hero__cta{ margin-top:36px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.hero__cta-note{ font-size:13px; color: var(--color-text-soft); }

.hero__proof{ display:flex; align-items:center; gap:28px; margin-top:56px; }
.hero__proof-item{ display:flex; flex-direction:column; align-items:center; gap:2px; }
.hero__proof-item strong{ font-size:22px; font-weight:800; }
.hero__proof-item span{ font-size:12.5px; color: var(--color-text-soft); }
.hero__proof-divider{ width:1px; height:32px; background: var(--color-border); }
@media (max-width:600px){ .hero__proof{ gap:18px; } .hero__proof-item strong{ font-size:18px; } }

.hero__visual{ margin-top:64px; width:100%; display:flex; justify-content:center; }
.mock-resume{
  width:min(560px, 92vw); background:#fff; border-radius: var(--radius-lg);
  border:1px solid var(--color-border); box-shadow: var(--shadow-lg);
  padding:28px; position:relative;
  animation: float 6s ease-in-out infinite;
}
@keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
.mock-resume__head{ display:flex; align-items:center; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--color-border); }
.mock-resume__avatar{ width:52px; height:52px; border-radius:50%; background: linear-gradient(135deg, var(--color-primary), #93B4F7); flex-shrink:0; }
.mock-resume__lines{ flex:1; display:flex; flex-direction:column; gap:8px; }
.mock-line{ height:10px; border-radius:6px; background: #E7EBF3; width:100%; }
.mock-line--title{ width:55%; height:14px; background:#D7E0F5; }
.mock-line--sub{ width:35%; }
.mock-line--label{ width:30%; background: var(--color-primary-light); }
.mock-line--short{ width:70%; }
.mock-resume__body{ display:flex; flex-direction:column; gap:18px; padding-top:20px; }
.mock-block{ display:flex; flex-direction:column; gap:8px; }
.mock-chip-row{ display:flex; gap:8px; }
.mock-chip{ width:60px; height:22px; border-radius: var(--radius-full); background: var(--color-primary-light); }
.mock-resume__badge{
  position:absolute; top:-14px; right:24px; background: var(--color-success-light); color:#15803D;
  font-size:12px; font-weight:700; padding:6px 12px; border-radius: var(--radius-full);
  border:1px solid #BBF0CE; display:flex; align-items:center; gap:6px;
}

/* =============================================================
   Seção de dor (persuasão emocional na landing)
   ============================================================= */
.pain{ padding:88px 24px; }
.pain__grid{ display:grid; grid-template-columns: 0.9fr 1.1fr; gap:56px; align-items:start; }
@media (max-width:900px){ .pain__grid{ grid-template-columns:1fr; gap:32px; } }
.pain__copy h2{ font-size: clamp(24px,3vw,32px); margin-top:12px; max-width:420px; }
.pain__lead{ margin-top:16px; font-size:15.5px; max-width:420px; }
.pain__list{ display:flex; flex-direction:column; gap:22px; }
.pain__item{ display:flex; gap:16px; align-items:flex-start; }
.pain__icon{ font-size:22px; width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid var(--color-border); border-radius: var(--radius-sm); }
.pain__item h3{ font-size:15.5px; margin-bottom:4px; }
.pain__item p{ font-size:13.5px; }
.pain__resolve{
  margin-top:48px; text-align:center; max-width:640px; margin-left:auto; margin-right:auto;
  padding:24px 28px; background: var(--color-primary-light); border-radius: var(--radius-md);
}
.pain__resolve p{ color: var(--color-primary-dark); font-size:15px; font-weight:500; }

/* =============================================================
   Sections generic
   ============================================================= */
.section{ padding:96px 24px; }
.section--muted{ background:#F1F5FB; padding:96px 24px; }
.section__head{ text-align:center; max-width:620px; margin:0 auto 52px; }
.section__head h2{ font-size: clamp(26px, 3.4vw, 38px); margin-top:12px; }
.eyebrow{ font-size:13px; font-weight:700; color: var(--color-primary); text-transform:uppercase; letter-spacing:0.06em; }
.tag-optional{ font-size:11px; font-weight:600; color: var(--color-text-soft); text-transform:none; letter-spacing:0; background:#EEF1F6; padding:2px 8px; border-radius: var(--radius-full); margin-left:6px; }

.grid{ display:grid; gap:24px; }
.grid--3{ grid-template-columns: repeat(3, 1fr); }
.grid--2{ grid-template-columns: repeat(2, 1fr); }
@media (max-width:860px){ .grid--3{ grid-template-columns:1fr; } .grid--2{ grid-template-columns:1fr; } }

.feature-card{
  background:#fff; border:1px solid var(--color-border); border-radius: var(--radius-md);
  padding:32px; box-shadow: var(--shadow-sm); transition: transform .2s var(--ease), box-shadow .2s var(--ease);
}
.feature-card:hover{ transform: translateY(-4px); box-shadow: var(--shadow-md); }
.feature-card__icon{ font-size:26px; width:52px; height:52px; display:flex; align-items:center; justify-content:center; background: var(--color-primary-light); border-radius: var(--radius-sm); margin-bottom:18px; }
.feature-card h3{ font-size:18px; margin-bottom:10px; }
.feature-card p{ font-size:14.5px; }

.steps-row{ display:grid; grid-template-columns: repeat(3, 1fr); gap:24px; }
@media (max-width:860px){ .steps-row{ grid-template-columns:1fr; } }
.step-card{ background:#fff; border:1px solid var(--color-border); border-radius: var(--radius-md); padding:30px; }
.step-card__num{ font-family: var(--font-serif); font-size:34px; color: var(--color-primary); font-weight:700; margin-bottom:14px; }
.step-card h3{ font-size:17px; margin-bottom:8px; }
.step-card p{ font-size:14.5px; }

.compare-grid{ align-items:stretch; }
.plan-card{
  background:#fff; border:1px solid var(--color-border); border-radius: var(--radius-lg);
  padding:36px; display:flex; flex-direction:column; gap:24px; position:relative;
}
.plan-card--highlight{ border:2px solid var(--color-primary); box-shadow: var(--shadow-lg); }
.plan-card__tag{
  position:absolute; top:-13px; left:32px; background: var(--color-primary); color:#fff;
  font-size:12px; font-weight:700; padding:5px 12px; border-radius: var(--radius-full);
}
.plan-card__head h3{ font-size:20px; }
.plan-card__price{ font-size:36px; font-weight:800; margin:10px 0 6px; }
.plan-card__list{ display:flex; flex-direction:column; gap:12px; flex:1; }
.plan-card__list li{ font-size:14.5px; padding-left:26px; position:relative; color: var(--color-text); }
.plan-card__list li::before{ content:"✓"; position:absolute; left:0; color: var(--color-success); font-weight:700; }

.faq-list{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
.faq-item{ background:#fff; border:1px solid var(--color-border); border-radius: var(--radius-md); padding:18px 22px; }
.faq-item summary{ cursor:pointer; font-weight:600; font-size:15.5px; list-style:none; display:flex; justify-content:space-between; align-items:center; }
.faq-item summary::-webkit-details-marker{ display:none; }
.faq-item summary::after{ content:"+"; color: var(--color-primary); font-size:20px; font-weight:400; }
.faq-item[open] summary::after{ content:"–"; }
.faq-item p{ margin-top:14px; font-size:14.5px; }

.cta-banner{
  background: linear-gradient(135deg, #1E3A8A, var(--color-primary));
  border-radius: var(--radius-lg); padding:64px 32px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:28px;
}
.cta-banner h2{ color:#fff; font-size: clamp(24px,3vw,32px); max-width:560px; }

.footer{ border-top:1px solid var(--color-border); padding:36px 24px; }
.footer__inner{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.footer p{ font-size:13px; }

/* =============================================================
   Wizard
   ============================================================= */
.wizard-header{ background:#fff; border-bottom:1px solid var(--color-border); position:sticky; top:0; z-index:30; }
.wizard-header__inner{ display:flex; align-items:center; gap:24px; padding:16px 24px; }
.wizard-progress{ flex:1; display:flex; align-items:center; gap:14px; }
.wizard-progress__track{ flex:1; height:6px; background: var(--color-border); border-radius: var(--radius-full); overflow:hidden; }
.wizard-progress__fill{ height:100%; width:16.6%; background: linear-gradient(90deg, var(--color-primary), #4F83F1); border-radius: var(--radius-full); transition: width .45s var(--ease); }
.wizard-progress__label{ font-size:13px; font-weight:600; color: var(--color-text-muted); white-space:nowrap; }

.wizard{ padding:56px 24px 140px; max-width:680px; }
.wizard-step{ display:none; animation: stepIn .35s var(--ease); }
.wizard-step.is-active{ display:block; }
@keyframes stepIn{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform:translateY(0);} }

.wizard-step__head{ margin-bottom:32px; }
.wizard-step__head h2{ font-size:26px; margin-top:8px; }
.wizard-step__head p{ margin-top:10px; font-size:14.5px; }

.field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.field{ display:flex; flex-direction:column; gap:7px; font-size:13.5px; font-weight:600; color: var(--color-text); }
.field--full{ grid-column:1/-1; }
.field input, .field select, .field textarea{
  border:1px solid var(--color-border); border-radius: var(--radius-sm); padding:12px 14px;
  background:#fff; color: var(--color-text); font-weight:400; transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); outline:none;
}
.field textarea{ resize:vertical; }
@media (max-width:640px){ .field-grid{ grid-template-columns:1fr; } }

.checkbox-field{ display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:500; color: var(--color-text-muted); }
.checkbox-field input{ width:18px; height:18px; accent-color: var(--color-primary); }

.choice-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:8px; }
.choice-row--sm{ grid-template-columns: repeat(2, minmax(110px,1fr)); margin-top:10px; }
.choice-row--wrap{ grid-template-columns: repeat(auto-fit, minmax(110px,1fr)); }
.choice-btn{
  background:#fff; border:1.5px solid var(--color-border); border-radius: var(--radius-md);
  padding:20px; text-align:left; display:flex; flex-direction:column; gap:4px;
  transition: border-color .15s, box-shadow .15s, background .15s, transform .15s;
}
.choice-btn:hover{ border-color:#B7C6E8; transform: translateY(-1px); }
.choice-btn.is-selected{ border-color: var(--color-primary); background: var(--color-primary-light); box-shadow: 0 0 0 3px rgba(37,99,235,0.10); }
.choice-btn__title{ font-weight:700; font-size:15.5px; }
.choice-btn__sub{ font-size:12.5px; color: var(--color-text-muted); font-weight:400; }
.choice-btn--sm{ padding:12px 16px; text-align:center; font-weight:600; font-size:14px; }

.mini-field{ margin-bottom:26px; }
.mini-field__label{ display:block; font-weight:600; font-size:14.5px; margin-bottom:4px; }

#cnh-categoria-wrap{ margin-top:14px; max-width:220px; }

.option-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:14px; }
@media (max-width:600px){ .option-grid{ grid-template-columns:1fr; } }
.option-card{
  background:#fff; border:1.5px solid var(--color-border); border-radius: var(--radius-md);
  padding:18px; font-weight:600; font-size:15px; text-align:left; transition: all .15s;
}
.option-card:hover{ border-color:#B7C6E8; transform: translateY(-1px); }
.option-card.is-selected{ border-color: var(--color-primary); background: var(--color-primary-light); color: var(--color-primary-dark); }

.exp-item{ background:#fff; border:1px solid var(--color-border); border-radius: var(--radius-md); padding:22px; margin-bottom:18px; position:relative; animation: stepIn .3s var(--ease); }
.exp-item__remove{ position:absolute; top:14px; right:14px; background:none; border:none; color: var(--color-text-soft); font-size:18px; }
.exp-item__remove:hover{ color:#DC2626; }
.exp-item .field-grid{ margin-top:4px; }
.exp-item__current{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:500; color: var(--color-text-muted); grid-column:1/-1; }
.exp-item__current input{ width:16px; height:16px; accent-color: var(--color-primary); }

.wizard-nav{
  position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.92); backdrop-filter: blur(8px);
  border-top:1px solid var(--color-border); padding:16px 24px; display:flex; justify-content:space-between; gap:12px; z-index:20;
}
.wizard-nav .btn{ min-width:120px; }

.hidden{ display:none !important; }

/* =============================================================
   Processing screen
   ============================================================= */
.processing{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
.processing__ring{ position:relative; width:96px; height:96px; margin-bottom:32px; }
.processing__ring-spin{
  position:absolute; inset:0; border-radius:50%;
  border:3px solid var(--color-primary-light); border-top-color: var(--color-primary);
  animation: spin 1.1s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.processing__ring-core{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; color: var(--color-primary); font-size:15px; }
.processing__title{ font-size:24px; margin-bottom:28px; }
.processing__list{ display:flex; flex-direction:column; gap:14px; text-align:left; }
.processing__list li{
  display:flex; align-items:center; gap:12px; font-size:14.5px; color: var(--color-text-soft);
  font-weight:500; transition: color .3s;
}
.processing__dot{ width:8px; height:8px; border-radius:50%; background: var(--color-border); flex-shrink:0; transition: background .3s, box-shadow .3s; }
.processing__list li.is-active{ color: var(--color-text); }
.processing__list li.is-active .processing__dot{ background: var(--color-primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.15); }
.processing__list li.is-done{ color: var(--color-text-muted); }
.processing__list li.is-done .processing__dot{ background: var(--color-success); }

/* =============================================================
   Result screen
   ============================================================= */
.result{ padding:56px 24px 100px; }
.result-badge{ background: var(--color-success-light); color:#15803D; font-size:13px; font-weight:700; padding:6px 14px; border-radius: var(--radius-full); border:1px solid #BBF0CE; }
.result__head{ text-align:center; max-width:560px; margin:0 auto 44px; }
.result__head h1{ font-size: clamp(26px,3.4vw,34px); }
.result__head p{ margin-top:12px; font-size:15px; }

/* Grid dos dois cards (grátis / premium). minmax garante que nenhuma
   coluna fique menor que 300px — abaixo disso, quebra para 1 coluna
   automaticamente, sem depender de um breakpoint fixo que possa falhar
   em resoluções intermediárias (notebook, tablet). */
.result-grid{
  display:grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap:28px; align-items:start; margin-bottom:40px;
}
@media (max-width:820px){ .result-grid{ grid-template-columns: 1fr; } }

.result-card{
  background:#fff; border:1px solid var(--color-border); border-radius: var(--radius-lg);
  padding:28px; display:flex; flex-direction:column; gap:16px; position:relative;
  min-width:0; /* evita que o conteúdo force a coluna do grid a crescer */
}
@media (max-width:560px){ .result-card{ padding:20px; } }
.result-card--premium{ border:2px solid var(--color-primary); box-shadow: var(--shadow-lg); }
.result-card__tag{ position:absolute; top:-13px; left:28px; background: var(--color-primary); color:#fff; font-size:12px; font-weight:700; padding:5px 12px; border-radius: var(--radius-full); }
.result-card__head{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.result-card__head h3{ font-size:18px; }
.result-card__price{ font-weight:800; font-size:20px; color: var(--color-primary); white-space:nowrap; }
.result-card__desc{ font-size:13.5px; }

/* Preview do currículo: a ALTURA do quadro é calculada dinamicamente via
   JS (fitResumePreview) a partir da largura real disponível, garantindo
   que o currículo apareça sempre proporcional e por inteiro — em
   qualquer resolução — sem cortes e sem quebra de layout. */
.preview-frame{
  position:relative; width:100%; overflow:hidden;
  border-radius: var(--radius-md); border:1px solid var(--color-border);
  background:#EEF1F6;
}
.preview-frame--free{ background:#F4F6F9; }
.preview-frame > .resume{ transform-origin: top left; box-shadow:none; }

.premium-actions-row{ display:flex; gap:12px; flex-wrap:wrap; }
.premium-actions-row .btn{ flex:1; min-width:130px; }
#premium-unlocked-actions{ display:flex; flex-direction:column; gap:14px; animation: stepIn .3s var(--ease); }

/* =============================================================
   Modal
   ============================================================= */
.modal-overlay{
  position:fixed; inset:0; background: rgba(17,24,39,0.55); backdrop-filter: blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal{
  background:#fff; border-radius: var(--radius-lg); padding:32px; width:100%; max-width:400px;
  position:relative; box-shadow: var(--shadow-lg); animation: modalIn .25s var(--ease);
}
@keyframes modalIn{ from{ opacity:0; transform: translateY(12px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
.modal__close{ position:absolute; top:16px; right:16px; background:none; border:none; font-size:16px; color: var(--color-text-soft); }
.modal h3{ font-size:19px; margin-bottom:6px; }
.modal__sub{ font-size:13.5px; margin-bottom:18px; }
.modal__price{ font-size:30px; font-weight:800; margin-bottom:20px; color: var(--color-primary); }
.modal .field{ margin-bottom:14px; }
.modal .field-grid{ margin-bottom:14px; }
.modal__note{ font-size:11.5px; color: var(--color-text-soft); text-align:center; margin-top:14px; }

/* ---- Modal Pix ---- */
.modal--pix{ max-width:380px; text-align:center; }
.modal--pix .modal__sub{ text-align:center; }
.modal--pix .modal__price{ text-align:center; }
.pix-qr{
  width:176px; height:176px; margin:8px auto 14px; display:grid;
  grid-template-columns: repeat(21, 1fr); grid-template-rows: repeat(21, 1fr);
  background:#fff; border:1px solid var(--color-border); border-radius: var(--radius-sm); padding:8px;
}
.pix-qr__cell{ background:transparent; }
.pix-qr__cell.on{ background:#111827; }
.pix-instruction{ font-size:12.5px; margin-bottom:14px; }
.pix-code-box{
  background:#F1F5FB; border:1px dashed #C7D2E5; border-radius: var(--radius-sm);
  padding:12px 14px; margin-bottom:12px; word-break:break-all;
}
.pix-code-box code{ font-size:11px; color: var(--color-text-muted); font-family: 'SFMono-Regular', Consolas, monospace; line-height:1.5; }

.pix-waiting{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 0 4px; }
.pix-waiting__spinner{
  width:52px; height:52px; border-radius:50%; margin-bottom:10px;
  border:3px solid var(--color-primary-light); border-top-color: var(--color-primary);
  animation: spin 1s linear infinite;
}
.pix-waiting h3{ font-size:17px; }
.pix-waiting p{ font-size:14px; color: var(--color-text); font-weight:500; }
.pix-waiting__note{ font-size:12px; color: var(--color-text-soft); margin-top:4px; }

/* =============================================================
   Resume templates — sistema de componentes compartilhados
   Inspirado em referências reais de currículo (hierarquia visual
   forte, sidebars de contato, timelines de experiência, tipografia
   com peso e espaçamento generoso) — layouts próprios e originais.
   ============================================================= */
.resume{
  width:794px; min-height:1000px; background:#fff; margin:0 auto;
  font-family: var(--font-body); color:#1F2430; box-shadow: var(--shadow-lg);
  position:relative; overflow:hidden;
}
.resume--plain{ box-shadow:none; border:1px solid #D1D5DB; padding:56px 60px; }
.resume h1,.resume h2,.resume h3{ margin:0; }
.resume p{ margin:0; color:inherit; }

/* ---- Átomos tipográficos genéricos (usados por vários templates) ---- */
.r-name{ font-size:28px; font-weight:800; letter-spacing:-0.01em; line-height:1.15; }
.r-role{ font-size:14px; font-weight:600; margin-top:6px; }
.r-contact{ display:flex; flex-wrap:wrap; gap:14px; font-size:12px; margin-top:10px; color:#4B5563; }
.r-section-title{ font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; }
.r-block{ margin-bottom:22px; }
.r-summary{ font-size:12.5px; line-height:1.65; color:#374151; }
.r-exp{ margin-bottom:15px; }
.r-exp__head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
.r-exp__title{ font-weight:700; font-size:13px; }
.r-exp__period{ font-size:11px; color:#6B7280; white-space:nowrap; }
.r-exp__company{ font-size:11.5px; color:#4B5563; margin-top:1px; font-weight:600; }
.r-exp__desc{ font-size:12px; margin-top:6px; line-height:1.58; color:#374151; }
.r-chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
.r-chip{ font-size:11px; font-weight:600; padding:5px 11px; border-radius: var(--radius-full); }
.r-edu-item{ font-size:12px; margin-bottom:7px; }
.r-edu-item strong{ display:block; font-size:12.5px; }
.r-plain-list{ font-size:12px; line-height:1.9; color:#374151; }

/* ---- Ícones de contato (círculo com svg) ---- */
.r-icon-row{ display:flex; align-items:center; gap:9px; margin-bottom:11px; font-size:11px; line-height:1.4; word-break:break-word; }
.r-icon-circle{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid rgba(255,255,255,.35); color:inherit; }
.r-icon-circle svg{ width:11px; height:11px; }
.r-icon-circle--onlight{ border-color:#CBD5E1; color:#334155; }

/* ---- Layout de duas colunas (sidebar + conteúdo principal) ---- */
.r-layout{ display:grid; grid-template-columns: 236px 1fr; align-items:stretch; min-height:1000px; }
.r-side{ padding:42px 26px; }
.r-side--navy{ background:#16233B; color:#E7EAF1; }
.r-side--light{ background:#F1F4F9; color:#1F2937; }
.r-side .r-name{ color:#fff; }
.r-side--light .r-name{ color:#111827; }
.r-side .r-role{ opacity:.85; text-transform:uppercase; font-size:11.5px; letter-spacing:.06em; }
.r-side-section{ margin-top:30px; }
.r-side-title{
  font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.09em;
  margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,.2);
}
.r-side--light .r-side-title{ border-bottom-color:#D7DEE9; color:#374151; }
.r-side-text{ font-size:11.5px; line-height:1.65; opacity:.92; }
.r-main{ padding:42px 38px; min-width:0; }
.r-main-title{
  font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
  margin-bottom:16px; padding-bottom:8px; border-bottom:2px solid #E5E9F0; color:#111827;
}

/* ---- Banner de topo (full-bleed, para Executive / Industrial / Creative) ---- */
.r-banner{ padding:40px 52px 30px; }
.r-banner .r-name{ font-size:30px; color:#fff; }
.r-banner .r-role{ font-size:13.5px; margin-top:6px; }
.r-banner--dark{ background:#111827; }
.r-banner--blue{ background: linear-gradient(120deg,#0F2340,var(--color-primary)); }
.r-banner--gradient{ background: linear-gradient(120deg,#111827 0%, var(--color-primary-dark) 55%, var(--color-primary) 100%); }
.r-banner .r-contact-row{ display:flex; gap:22px; flex-wrap:wrap; margin-top:18px; }
.r-banner .r-icon-row{ margin-bottom:0; color:#fff; }
.r-banner .r-icon-circle{ border-color:rgba(255,255,255,.4); }
.r-body-pad{ padding:34px 52px 46px; }

/* ---- Cabeçalho "tag" (rótulo em bloco cinza) + bloco com borda de destaque ---- */
.r-tag-title{
  display:inline-block; background:#EEF0F3; color:#111827; font-size:11px; font-weight:800;
  text-transform:uppercase; letter-spacing:.08em; padding:6px 12px; border-radius:4px; margin-bottom:16px;
}
.r-accent-block{ border-left:3px solid var(--color-primary); padding-left:16px; margin-bottom:18px; }

/* ---- Timeline de experiência (linha vertical + marcadores) ---- */
.r-timeline{ position:relative; padding-left:20px; }
.r-timeline::before{ content:""; position:absolute; left:4px; top:5px; bottom:5px; width:1px; background:#D9DEE8; }
.r-timeline-item{ position:relative; padding-bottom:20px; }
.r-timeline-item:last-child{ padding-bottom:0; }
.r-timeline-dot{ position:absolute; left:-20px; top:3px; width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--color-primary); }
.r-timeline-dot--gradient{ border:none; background: linear-gradient(135deg, var(--color-primary), #4F83F1); width:11px; height:11px; }

/* ---- Caixas de experiência com borda (Industrial) ---- */
.r-exp-box{ border:1px solid #E5E9F0; border-left:4px solid var(--color-primary); border-radius:6px; padding:13px 16px; margin-bottom:13px; background:#FAFBFD; }

/* ---- Two-column footer helper (usado em Executive) ---- */
.r-two-col{ display:grid; grid-template-columns:1fr 1fr; gap:32px; }

/* ---- Variantes de chip ---- */
.r-chip--navy{ background:#16233B; color:#fff; }
.r-chip--outline{ background:none; border:1px solid #9CA3AF; color:#374151; }
.r-chip--soft-primary{ background: var(--color-primary-light); color: var(--color-primary-dark); }
.r-chip--gradient{ background: linear-gradient(135deg, var(--color-primary), #4F83F1); color:#fff; }
.r-chip--dark{ background:#111827; color:#fff; }
.r-chip--minimal{ background:none; border:1px solid #E5E7EB; color:#374151; }

/* =============================================================
   1. Corporate — sidebar em navy, sóbrio, para administrativo/comercial
   ============================================================= */
.resume--corporate .r-name{ font-size:26px; }

/* =============================================================
   2. Executive — banner escuro + seções em bloco, para liderança
   ============================================================= */
.resume--executive .r-name{ font-size:30px; }

/* =============================================================
   3. ATS Pro — coluna única, extremamente limpo (compatível com leitores de currículo)
   ============================================================= */
.resume--ats{ padding:52px 58px; font-family:'Inter',sans-serif; }
.resume--ats .r-header{ border-bottom:1px solid #111827; padding-bottom:14px; margin-bottom:22px; }
.resume--ats .r-name{ font-size:22px; }
.resume--ats .r-section-title{ border-bottom:1px solid #111827; padding-bottom:4px; }

/* =============================================================
   4. Modern — sidebar clara + timeline, para primeiro emprego / cargo indefinido
   ============================================================= */
.resume--modern .r-role-badge{
  display:inline-block; background: var(--color-primary); color:#fff; padding:4px 12px;
  border-radius: var(--radius-full); font-size:12px; font-weight:600; margin-top:8px;
}

/* =============================================================
   5. Minimal — formas decorativas suaves, elegante e centrado
   ============================================================= */
.resume--minimal{ background:#fff; }
.resume--minimal::before{
  content:""; position:absolute; top:-130px; left:-170px; width:480px; height:340px;
  background:#EEF1F6; border-radius:0 0 220px 40%; transform:rotate(-6deg); z-index:0;
}
.resume--minimal::after{
  content:""; position:absolute; bottom:-150px; right:-170px; width:460px; height:320px;
  background:#EEF1F6; border-radius:40% 220px 0 0; transform:rotate(-6deg); z-index:0;
}
.resume--minimal .r-content{ position:relative; z-index:1; padding:64px 76px; }
.resume--minimal .r-header{ text-align:center; margin-bottom:36px; }
.resume--minimal .r-name{ font-family: var(--font-serif); font-weight:700; font-size:29px; }
.resume--minimal .r-contact{ justify-content:center; }
.resume--minimal .r-section-title{ text-align:center; letter-spacing:0.14em; color:#9CA3AF; }
.resume--minimal .r-summary{ text-align:center; max-width:520px; margin:0 auto; }

/* =============================================================
   6. Industrial — banner azul robusto + caixas com borda, para produção/logística
   ============================================================= */
.resume--industrial .r-name{ font-size:28px; }

/* =============================================================
   7. Creative — banner em gradiente + chips coloridos, para áreas criativas
   ============================================================= */
.resume--creative .r-name{ font-size:30px; }

.export-root{ position:fixed; left:-9999px; top:0; }
</head>

    { re: /obra|constru|pedreiro|pintor|servente/i, text: 'Atuação em atividades operacionais de obra, apoio à equipe de construção, organização de materiais e ferramentas, seguindo rigorosamente as normas de segurança do trabalho em todas as etapas da execução.' },
    { re: /gerente|ger[êe]nc|coordenador|supervisor|l[ií]der|gestor/i, text: 'Responsável pela liderança e coordenação da equipe, organização das rotinas de trabalho, acompanhamento de metas e resultados, além do suporte ao desenvolvimento dos colaboradores e à melhoria contínua dos processos.' },
    { re: /design|criativ|social media|conte[uú]do|marketing/i, text: 'Responsável pela criação de peças e conteúdos visuais, alinhamento com a identidade da marca, organização das demandas criativas e colaboração direta com a equipe para entrega de materiais dentro do prazo e com qualidade.' },
    { re: /desenvolv|program|sistema|software/i, text: 'Responsável pelo desenvolvimento, manutenção e testes de sistemas e funcionalidades, participação em rotinas de análise e correção de problemas, e colaboração com a equipe para entrega de soluções com qualidade e dentro dos prazos definidos.' },
  ];

  // Frases de fechamento usadas para enriquecer descrições que não batem com
  // nenhum item da biblioteca acima — sempre valorizando comportamento e
  // atitude (nunca inventando uma habilidade técnica que a pessoa não citou).
  const GENERIC_CLOSERS = [
    'sempre prezando pela organização, responsabilidade e qualidade na execução das tarefas.',
    'com foco em produtividade, atenção aos detalhes e bom relacionamento com a equipe.',
    'demonstrando comprometimento, pontualidade e disposição constante para aprender.',
    'contribuindo com dedicação para os resultados e para a boa rotina do setor.'
  ];

  // Regras de classificação de área profissional, usadas para escolher
  // o tom do texto e o template ideal.
  const AREA_RULES = [
    { area: 'tecnologia', re: /desenvolv|program|ti\b|suporte t[ée]cnico|sistemas|dados|software|ux|ui\b/ },
    { area: 'criativo', re: /design|criativ|marketing|conte[uú]do|social media|fot[óo]graf|edi[çc][ãa]o de v[ií]deo/ },
    { area: 'lideranca', re: /gerente|ger[êe]nc|coordenador|supervisor|l[ií]der|diretor|gestor/ },
    { area: 'producao', re: /produ[çc][ãa]o|log[íi]stica|almoxarifado|opera[çc][ãa]o|f[áa]brica|montagem|soldador|obra/ },
    { area: 'administrativo', re: /administrativ|recep[çc][ãa]o|financeiro|rh\b|recursos humanos|escrit[óo]rio|secret/ },
    { area: 'comercial', re: /vend|comercial|atendente|caixa|repositor/ },
  ];

  // Mapa: área detectada → template ideal (escolha automática, sem intervenção do usuário)
  const TEMPLATE_BY_AREA = {
    tecnologia: 'ats', criativo: 'creative', lideranca: 'executive',
    producao: 'industrial', administrativo: 'corporate', comercial: 'corporate', geral: 'minimal'
  };

  // Competências sugeridas por área (nunca inventa certificações — apenas traços comportamentais/genéricos)
  const SKILLS_BY_AREA = {
    tecnologia: ['Organização', 'Raciocínio lógico', 'Atenção a detalhes'],
    criativo: ['Criatividade', 'Atenção a detalhes', 'Comunicação visual'],
    lideranca: ['Liderança', 'Organização de equipe', 'Tomada de decisão'],
    producao: ['Trabalho em equipe', 'Atenção às normas de segurança', 'Agilidade'],
    administrativo: ['Organização', 'Atenção a detalhes', 'Boa comunicação'],
    comercial: ['Comunicação', 'Atendimento ao cliente', 'Proatividade'],
    geral: ['Responsabilidade', 'Trabalho em equipe', 'Vontade de aprender']
  };


  /* ===============================================================
     2. VARIÁVEIS GLOBAIS
     Referências de DOM e controle de navegação/estado da aplicação
     (tudo que não é "dado preenchido pelo usuário" fica aqui).
     =============================================================== */

  const dom = {
    form: document.getElementById('wizard-form'),
    steps: Array.from(document.querySelectorAll('.wizard-step')),
    progressFill: document.getElementById('progress-fill'),
    progressLabel: document.getElementById('progress-label'),
    btnPrev: document.getElementById('btn-prev'),
    btnNext: document.getElementById('btn-next'),
    paymentModal: document.getElementById('payment-modal'),
    exportRoot: document.getElementById('export-root')
  };

  const app = {
    currentStep: 1,
    template: null,   // chave do template escolhido pela IA
    aiResult: null,   // conteúdo gerado pela IA (objeto)
    unlocked: false   // premium desbloqueado?
  };

  let expCounter = 0; // contador auxiliar para gerar IDs únicos de experiências


  /* ===============================================================
     3. DADOS DO USUÁRIO
     Estrutura central com tudo que o usuário informa no wizard.
     =============================================================== */

  const userData = {
    nome: '', telefone: '', email: '', cidade: '', estado: '',
    cargo: '', cargoIndefinido: false,
    primeiroEmprego: null,   // 'sim' | 'nao'
    experiencias: [],        // [{empresa, cargo, inicio, fim, atual, tarefas}]
    escolaridade: '',
    cursos: '',
    cnh: null, cnhCategoria: '',
    veiculo: null, turnos: null, viagens: null, mudanca: null,
    informatica: '',
    idiomas: ''
  };

  // Copia os valores da etapa atual do formulário para `userData`
  function collectStepData(step) {
    if (step === 1) {
      userData.nome = dom.form.nome.value.trim();
      userData.telefone = dom.form.telefone.value.trim();
      userData.email = dom.form.email.value.trim();
      userData.cidade = dom.form.cidade.value.trim();
      userData.estado = dom.form.estado.value.trim();
    }
    if (step === 2) {
      userData.cargo = dom.form.cargo.value.trim();
      userData.cargoIndefinido = dom.form.cargoIndefinido.checked;
    }
    if (step === 3 && userData.primeiroEmprego === 'nao') {
      userData.experiencias = Array.from(document.querySelectorAll('.exp-item')).map(item => ({
        empresa: item.querySelector('[data-f="empresa"]').value.trim(),
        cargo: item.querySelector('[data-f="cargo"]').value.trim(),
        inicio: item.querySelector('[data-f="inicio"]').value.trim(),
        fim: item.querySelector('[data-f="fim"]').value.trim(),
        atual: item.querySelector('[data-f="atual"]').checked,
        tarefas: item.querySelector('[data-f="tarefas"]').value.trim()
      }));
    }
    if (step === 5) userData.cursos = dom.form.cursos.value.trim();
    if (step === 6) userData.idiomas = dom.form.idiomas.value.trim();
  }


  /* ===============================================================
     4. COMPONENTES VISUAIS
     Funções que controlam navegação entre telas, seleção de opções
     (choice-btn / option-card) e blocos reutilizáveis de UI.
     =============================================================== */

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('screen--active'));
    document.getElementById(id).classList.add('screen--active');
    window.scrollTo(0, 0);
  }

  document.querySelectorAll('[data-action="start"]').forEach(btn => {
    btn.addEventListener('click', () => { showScreen('screen-form'); goToStep(1); });
  });
  document.querySelector('[data-action="exit-wizard"]').addEventListener('click', (e) => {
    e.preventDefault(); showScreen('screen-landing');
  });
  document.querySelector('[data-action="restart"]').addEventListener('click', (e) => {
    e.preventDefault(); location.reload();
  });
  document.getElementById('btn-restart').addEventListener('click', () => location.reload());

  // Botões de seleção única (choice-btn e option-card), agrupados por data-field
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.choice-btn, .option-card');
    if (!btn) return;
    const field = btn.dataset.field;
    const value = btn.dataset.value;
    document.querySelectorAll(`[data-field="${field}"]`).forEach(b => b.classList.toggle('is-selected', b === btn));
    userData[field] = value;

    if (field === 'primeiroEmprego') {
      const wrap = document.getElementById('experiencias-wrap');
      if (value === 'nao') {
        wrap.classList.remove('hidden');
        if (document.querySelectorAll('.exp-item').length === 0) addExperienceRow();
      } else {
        wrap.classList.add('hidden');
        userData.experiencias = [];
      }
    }
    if (field === 'cnh') {
      document.getElementById('cnh-categoria-wrap').style.display = value === 'sim' ? 'flex' : 'none';
    }
  });


  /* ===============================================================
     5. LÓGICA DO WIZARD
     Navegação entre etapas, validação e o formulário dinâmico de
     experiências profissionais.
     =============================================================== */

  function goToStep(n) {
    app.currentStep = n;
    dom.steps.forEach(s => s.classList.toggle('is-active', Number(s.dataset.step) === n));
    dom.progressFill.style.width = ((n / CONFIG.totalSteps) * 100) + '%';
    dom.progressLabel.textContent = `Etapa ${n} de ${CONFIG.totalSteps}`;
    dom.btnPrev.style.visibility = n === 1 ? 'hidden' : 'visible';
    dom.btnNext.textContent = n === CONFIG.totalSteps ? 'Gerar meu currículo' : 'Continuar';
  }

  dom.btnPrev.addEventListener('click', () => { if (app.currentStep > 1) goToStep(app.currentStep - 1); });

  dom.btnNext.addEventListener('click', () => {
    if (!validateStep(app.currentStep)) return;
    collectStepData(app.currentStep);
    if (app.currentStep < CONFIG.totalSteps) {
      goToStep(app.currentStep + 1);
    } else {
      startGeneration();
    }
  });

  function validateStep(n) {
    if (n === 1) {
      const { nome, telefone, cidade, estado } = dom.form;
      if (!nome.value.trim() || !telefone.value.trim() || !cidade.value.trim() || !estado.value.trim()) {
        alert('Preencha nome, telefone, cidade e estado para continuar.');
        return false;
      }
    }
    if (n === 3) {
      if (userData.primeiroEmprego === null) { alert('Selecione se este é seu primeiro emprego.'); return false; }
      if (userData.primeiroEmprego === 'nao' && document.querySelectorAll('.exp-item').length === 0) {
        alert('Adicione ao menos uma experiência.'); return false;
      }
    }
    if (n === 4 && !userData.escolaridade) { alert('Selecione sua escolaridade.'); return false; }
    return true;
  }

  document.getElementById('add-experiencia').addEventListener('click', addExperienceRow);

  function addExperienceRow() {
    expCounter++;
    const id = 'exp-' + expCounter;
    const wrap = document.createElement('div');
    wrap.className = 'exp-item';
    wrap.id = id;
    wrap.innerHTML = `
      <button type="button" class="exp-item__remove" aria-label="Remover">✕</button>
      <div class="field-grid">
        <label class="field"><span>Empresa</span><input type="text" data-f="empresa" placeholder="Ex: Mercado Bom Preço"></label>
        <label class="field"><span>Cargo</span><input type="text" data-f="cargo" placeholder="Ex: Repositor"></label>
        <label class="field"><span>Data de entrada</span><input type="month" data-f="inicio"></label>
        <label class="field"><span>Data de saída</span><input type="month" data-f="fim"></label>
        <div class="exp-item__current">
          <input type="checkbox" data-f="atual" id="${id}-atual">
          <label for="${id}-atual">Ainda trabalho aqui</label>
        </div>
        <label class="field field--full"><span>O que você fazia? (em suas palavras)</span>
          <textarea rows="2" data-f="tarefas" placeholder='Ex: "Atendia clientes, mexia no caixa e organizava as prateleiras"'></textarea>
        </label>
      </div>`;
    document.getElementById('experiencias-list').appendChild(wrap);

    wrap.querySelector('[data-f="atual"]').addEventListener('change', (e) => {
      wrap.querySelector('[data-f="fim"]').disabled = e.target.checked;
      if (e.target.checked) wrap.querySelector('[data-f="fim"]').value = '';
    });
    wrap.querySelector('.exp-item__remove').addEventListener('click', () => wrap.remove());
  }


  /* ===============================================================
     6. MOTOR DE GERAÇÃO DE CURRÍCULO
     -----------------------------------------------------------------
     generateWithAI(data) é o coração do produto. Hoje usa regras
     locais (determinísticas). Em produção, troque o CORPO desta
     função por uma chamada real de IA — por exemplo:

       async function generateWithAI(data) {
         const res = await fetch('https://api.anthropic.com/v1/messages', {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({
             model: 'claude-sonnet-4-6',
             max_tokens: 1000,
             messages: [{ role: 'user', content: buildPrompt(data) }]
           })
         });
         const json = await res.json();
         return parseAiJson(json); // deve retornar o mesmo formato usado abaixo
       }

     A regra de negócio "nunca inventar empresas/cursos/experiências"
     deve então virar uma instrução no prompt do sistema enviado à IA.
     =============================================================== */

  // Reescreve uma tarefa informada pelo usuário em uma descrição profissional
  // completa, usando a TASK_LIBRARY. Não inventa fatos — apenas expande o que
  // o usuário já descreveu, com o vocabulário e o nível de detalhe que um
  // profissional de RH usaria.
  function professionalizeTask(raw) {
    if (!raw) return '';
    const matches = TASK_LIBRARY.filter(rule => rule.re.test(raw));
    if (matches.length) {
      // Combina até 2 descrições reconhecidas (evita redundância excessiva
      // quando a pessoa cita mais de uma atividade correlata)
      return matches.slice(0, 2).map(m => m.text).join(' ');
    }
    // Nenhuma correspondência: enriquece o texto do próprio usuário, mantendo
    // fielmente o que foi informado e adicionando apenas moldura profissional.
    const clean = raw.replace(/^(eu |eu era |era |fazia |fiz )/i, '').trim();
    const closer = GENERIC_CLOSERS[Math.floor(Math.random() * GENERIC_CLOSERS.length)];
    return `Responsável por ${lowerFirst(capitalize(clean))}, ${closer}`;
  }

  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function lowerFirst(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function formatPeriod(exp) {
    const fmt = (v) => {
      if (!v) return '';
      const [y, m] = v.split('-');
      const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      return `${meses[Number(m) - 1] || ''} ${y}`;
    };
    const ini = fmt(exp.inicio);
    const fim = exp.atual ? 'Atual' : fmt(exp.fim);
    return [ini, fim].filter(Boolean).join(' — ');
  }

  // Classifica a área profissional a partir do cargo e das experiências informadas
  function detectArea(data) {
    const text = (data.cargo + ' ' + data.experiencias.map(e => e.cargo + ' ' + e.tarefas).join(' ')).toLowerCase();
    for (const rule of AREA_RULES) if (rule.re.test(text)) return rule.area;
    return 'geral';
  }

  // Escolha automática do template — o usuário nunca escolhe.
  // Primeiro emprego e cargo indefinido priorizam um layout mais neutro (Modern).
  function chooseTemplate(data, area) {
    if (data.cargoIndefinido || data.primeiroEmprego === 'sim') return 'modern';
    return TEMPLATE_BY_AREA[area] || 'minimal';
  }

  // Objetivo profissional: 1-2 frases diretas, com variação de redação para
  // que o texto nunca soe repetitivo entre currículos diferentes.
  function buildObjective(data) {
    const cargo = data.cargoIndefinido ? 'uma nova oportunidade na área de interesse' : `a vaga de ${data.cargo}`;
    if (data.primeiroEmprego === 'sim') {
      return pick([
        `Em busca da primeira oportunidade profissional, para ${cargo}, com disposição para aprender rapidamente, absorver novos processos e contribuir com dedicação desde o primeiro dia.`,
        `Candidato(a) à ${cargo}, iniciando a trajetória profissional com motivação, vontade de aprender e comprometimento com os resultados da empresa.`
      ]);
    }
    if (data.cargoIndefinido) {
      return pick([
        `Profissional em busca de uma nova oportunidade, aberto(a) a diferentes áreas, com foco em aprendizado contínuo, entrega de resultados e adaptação rápida a novos desafios.`,
        `Em busca de uma recolocação profissional, disposto(a) a atuar em diferentes frentes, unindo versatilidade, comprometimento e vontade de crescer junto à empresa.`
      ]);
    }
    return pick([
      `Profissional com experiência na área, buscando ${cargo}, unindo comprometimento, organização e vontade de evoluir junto à empresa.`,
      `Em busca de ${cargo}, trazendo uma trajetória pautada por responsabilidade, organização e entrega consistente nas funções exercidas.`,
      `Busca uma nova oportunidade como ${data.cargoIndefinido ? 'profissional' : data.cargo}, aplicando a experiência já construída para gerar resultados sólidos desde o início.`
    ]);
  }

  // Resumo profissional: parágrafo mais longo e personalizado, cruzando
  // experiência, escolaridade, cursos, CNH/veículo, informática e idiomas —
  // sempre valorizando responsabilidade, organização e trabalho em equipe,
  // sem jamais inventar um fato que o usuário não informou.
  function buildSummary(data, area) {
    const nExp = data.experiencias.length;
    const sentences = [];

    if (data.primeiroEmprego === 'sim') {
      sentences.push(pick([
        'Candidato(a) em início de carreira, com boa capacidade de aprendizado, adaptação a novas rotinas e disposição para assumir responsabilidades gradualmente.',
        'Profissional em início de trajetória, que busca uma primeira experiência sólida para desenvolver suas habilidades e contribuir ativamente com a equipe.'
      ]));
      if (data.escolaridade) {
        sentences.push(`Possui formação em nível ${data.escolaridade.toLowerCase()}${data.cursos ? ', complementada por cursos de capacitação relacionados à área' : ''}, o que reforça sua base para começar com o pé direito.`);
      }
      sentences.push('É reconhecido(a) por responsabilidade, pontualidade, organização e disposição genuína para trabalhar em equipe e aprender com o dia a dia.');
    } else {
      sentences.push(nExp > 1
        ? `Profissional com passagem por ${nExp} funções anteriores, construindo um histórico consistente de responsabilidade, organização e comprometimento com os resultados de cada equipe da qual fez parte.`
        : 'Profissional com experiência prática consolidada na função, reconhecido(a) por responsabilidade, organização e comprometimento nas atividades exercidas no dia a dia.');

      if (area === 'lideranca') sentences.push('Tem experiência em coordenar equipes, organizar rotinas de trabalho e acompanhar metas, sempre com foco em resultados e no desenvolvimento das pessoas ao seu redor.');
      if (area === 'tecnologia') sentences.push('Apresenta perfil analítico e organizado, com facilidade para lidar com ferramentas, sistemas e processos, além de disposição para aprender novas tecnologias.');
      if (area === 'criativo') sentences.push('Une criatividade e atenção aos detalhes na entrega de materiais e soluções visuais, sempre alinhado(a) às necessidades de cada projeto.');
      if (area === 'producao') sentences.push('Está habituado(a) à rotina operacional, ao cumprimento de metas de produtividade e ao respeito rigoroso às normas de segurança do trabalho.');
      if (area === 'comercial') sentences.push('Tem facilidade para se comunicar e se relacionar com o público, características que favorecem um atendimento próximo e resultados comerciais consistentes.');

      sentences.push(pick([
        'Destaca-se pela boa comunicação, facilidade para trabalhar em equipe e disposição constante para novos desafios.',
        'É uma pessoa organizada, proativa e com facilidade para se adaptar a diferentes rotinas e equipes de trabalho.'
      ]));
    }

    if (data.escolaridade && data.primeiroEmprego !== 'sim') {
      sentences.push(`Possui formação em nível ${data.escolaridade.toLowerCase()}.`);
    }
    if (data.informatica && data.informatica !== 'Nenhum') {
      sentences.push(`Tem conhecimento em informática no nível ${data.informatica.toLowerCase()}, o que agrega às rotinas administrativas e operacionais do dia a dia.`);
    }
    if (data.idiomas) {
      sentences.push(`Também traz conhecimento em ${data.idiomas.toLowerCase()}, um diferencial para ambientes com maior diversidade ou contato internacional.`);
    }
    if (data.cnh === 'sim') {
      sentences.push(`Possui CNH categoria ${data.cnhCategoria || '—'}${data.veiculo === 'sim' ? ' e veículo próprio' : ''}, o que garante mobilidade e disponibilidade para rotinas externas.`);
    }
    if (data.turnos === 'sim' || data.viagens === 'sim' || data.mudanca === 'sim') {
      const disponibilidades = [
        data.turnos === 'sim' && 'trabalhar em turnos',
        data.viagens === 'sim' && 'realizar viagens a trabalho',
        data.mudanca === 'sim' && 'mudança de cidade'
      ].filter(Boolean);
      sentences.push(`Apresenta plena disponibilidade para ${disponibilidades.join(', ')}, ampliando as possibilidades de atuação.`);
    }

    return sentences.join(' ');
  }

  function buildSkills(data, area) {
    const skills = new Set(SKILLS_BY_AREA[area] || SKILLS_BY_AREA.geral);
    skills.add('Comprometimento');
    skills.add('Pontualidade');
    skills.add('Organização');
    if (data.primeiroEmprego === 'sim') skills.add('Facilidade de aprendizado');
    if (data.turnos === 'sim') skills.add('Disponibilidade para turnos');
    if (data.viagens === 'sim') skills.add('Disponibilidade para viagens');
    if (data.informatica && data.informatica !== 'Nenhum') skills.add(`Informática (${data.informatica.toLowerCase()})`);
    return Array.from(skills).slice(0, 9);
  }

  // Função principal do motor de IA — ver comentário no cabeçalho da seção 6
  // para o ponto exato de substituição por uma API real.
  function generateWithAI(data) {
    const area = detectArea(data);
    const template = chooseTemplate(data, area);
    const experiencias = data.experiencias.map(exp => ({
      cargo: exp.cargo || 'Profissional',
      empresa: exp.empresa || '',
      periodo: formatPeriod(exp),
      descricao: professionalizeTask(exp.tarefas)
    }));
    const extraInfo = [];
    if (data.cnh === 'sim') extraInfo.push(`CNH categoria ${data.cnhCategoria || '—'}`);
    if (data.veiculo === 'sim') extraInfo.push('Veículo próprio');
    if (data.idiomas) extraInfo.push(data.idiomas);

    return {
      area, template,
      cargoTitulo: data.cargoIndefinido ? 'Profissional em busca de oportunidade' : (data.cargo || 'Profissional'),
      objetivo: buildObjective(data),
      resumo: buildSummary(data, area),
      experiencias,
      competencias: buildSkills(data, area),
      cursos: data.cursos ? data.cursos.split(',').map(c => c.trim()).filter(Boolean) : [],
      extraInfo
    };
  }

  // Tela de processamento: anima a lista de etapas e então dispara a geração
  function startGeneration() {
    showScreen('screen-processing');
    const items = Array.from(document.querySelectorAll('#processing-list li'));
    items.forEach(li => li.classList.remove('is-active', 'is-done'));

    let i = 0;
    (function step() {
      if (i > 0) { items[i - 1].classList.remove('is-active'); items[i - 1].classList.add('is-done'); }
      if (i < items.length) { items[i].classList.add('is-active'); i++; setTimeout(step, 550); }
      else setTimeout(finishGeneration, 500);
    })();
  }

  function finishGeneration() {
    app.aiResult = generateWithAI(userData);
    app.template = app.aiResult.template;
    renderResultScreen();
    showScreen('screen-result');
  }


  /* ===============================================================

     Componentes reutilizáveis (cabeçalho, resumo, experiência,

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  };
  function iconRow(type, text, onLight) {

    return `<div class="r-icon-row"><span class="r-icon-circle${onLight ? ' r-icon-circle--onlight' : ''}">${ICONS[type]}</span><span>${escapeHtml(text)}</span></div>`;

  // ---- Peças reutilizáveis entre templates ----
  function chipRow(list, chipClass) {
    return `<div class="r-chip-row">${list.map(c => `<span class="r-chip ${chipClass}">${escapeHtml(c)}</span>`).join('')}</div>`;

  /* ===============================================================
     8. EXPORTAÇÃO PDF/PNG + PAGAMENTO
     Ajuste responsivo dos previews, fluxo de pagamento via Pix
     (preparado para integração real com webhook) e geração de
     arquivos reais com html2canvas + jsPDF (via CDN).
     =============================================================== */

  // ---- Responsividade dos previews de currículo ----
  // Em vez de uma escala fixa em CSS (que quebra em resoluções
  // intermediárias), medimos a largura real do quadro e escalamos o
  // currículo (794px de largura nativa) proporcionalmente, ajustando
  // também a altura do quadro — garante que o currículo apareça
  // sempre inteiro e proporcional, em qualquer tela.
  const RESUME_NATIVE_WIDTH = 794;

  function fitResumePreview(frame) {
    const resumeEl = frame.querySelector('.resume');
    if (!resumeEl) return;
    resumeEl.style.transform = 'none';
    const scale = frame.clientWidth / RESUME_NATIVE_WIDTH;
    const naturalHeight = resumeEl.scrollHeight;
    resumeEl.style.transform = `scale(${scale})`;
    frame.style.height = (naturalHeight * scale) + 'px';
  }

  function fitAllPreviews() {
    document.querySelectorAll('.preview-frame').forEach(fitResumePreview);
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (document.getElementById('screen-result').classList.contains('screen--active')) fitAllPreviews();
    }, 150);
  });

  document.getElementById('btn-download-free').addEventListener('click', (e) => {
    withButtonLoading(e.currentTarget, () =>
      exportToPdf(document.getElementById('preview-free').querySelector('.resume'), fileName('gratuito', 'pdf')));
  });

  // ---- Fluxo de pagamento via Pix ----
  const pixStepQr = document.getElementById('pix-step-qr');
  const pixStepWaiting = document.getElementById('pix-step-waiting');
  let pixConfirmTimer = null;

  document.getElementById('btn-unlock').addEventListener('click', () => {
    pixStepQr.classList.remove('hidden');
    pixStepWaiting.classList.add('hidden');
    document.getElementById('pix-qr-code').innerHTML = buildFakeQrHTML();
    document.getElementById('pix-code-text').textContent = buildFakePixCode();
    dom.paymentModal.classList.remove('hidden');
  });

  document.getElementById('payment-modal-close').addEventListener('click', () => {
    dom.paymentModal.classList.add('hidden');
    clearTimeout(pixConfirmTimer);
  });

  document.getElementById('btn-copy-pix').addEventListener('click', async (e) => {
    const code = document.getElementById('pix-code-text').textContent;
    const btn = e.currentTarget;
    const original = btn.textContent;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(code);
      } else {
        // Fallback para navegadores/contextos sem suporte à Clipboard API
        const tmp = document.createElement('textarea');
        tmp.value = code;
        tmp.style.position = 'fixed';
        tmp.style.left = '-9999px';
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand('copy');
        document.body.removeChild(tmp);
      }
      btn.textContent = 'Código copiado ✓';
    } catch (err) {
      btn.textContent = 'Não foi possível copiar';
    }
    setTimeout(() => { btn.textContent = original; }, 2200);
  });

  document.getElementById('btn-go-waiting').addEventListener('click', () => {
    pixStepQr.classList.add('hidden');
    pixStepWaiting.classList.remove('hidden');
    // -----------------------------------------------------------------
    // Ponto de integração: esta é a tela que deve permanecer aguardando
    // a confirmação real do pagamento (via polling em um endpoint próprio
    // ou via webhook do provedor Pix atualizando o estado no backend).
    // Por enquanto, simulamos a aprovação automaticamente após alguns
    // segundos, apenas para permitir testar o restante do fluxo.
    // -----------------------------------------------------------------
    pixConfirmTimer = setTimeout(() => {
      dom.paymentModal.classList.add('hidden');
      unlockPremium();
    }, 4500);
  });

  // Gera um "QR Code" fictício (padrão visual apenas — não corresponde a um
  // pagamento real) usando uma grade de células preenchida de forma
  // determinística, com os três marcadores de posição característicos de
  // um QR Code real.
  function buildFakeQrHTML() {
    const size = 21;
    const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
    const isFinderOn = (r, c) => {
      const rr = r < 7 ? r : (r >= size - 7 ? r - (size - 7) : -1);
      const cc = c < 7 ? c : (c >= size - 7 ? c - (size - 7) : -1);
      if (rr < 0 || cc < 0) return false;
      const border = rr === 0 || rr === 6 || cc === 0 || cc === 6;
      const core = rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4;
      return border || core;
    };
    let seed = (userData.nome || 'curriculox').length + Date.now() % 97;
    function pseudoRandom() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

    let cells = '';
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const on = finder(r, c) ? isFinderOn(r, c) : pseudoRandom() > 0.55;
        cells += `<span class="pix-qr__cell${on ? ' on' : ''}"></span>`;
      }
    }
    return cells;
  }

  // Código Pix "copia e cola" fictício, apenas para fins de demonstração visual.
  function buildFakePixCode() {
    return '00020126580014BR.GOV.BCB.PIX0136curriculox-' + slug(userData.nome || 'cliente') +
      '5204000053039865406000.049' + '5802BR5915CURRICULOX LTDA6009SAO PAULO62070503***6304A1B2';
  }

  function unlockPremium() {
    app.unlocked = true;
    document.getElementById('premium-locked-actions').classList.add('hidden');
    document.getElementById('premium-unlocked-actions').classList.remove('hidden');
    if (userData.email) document.getElementById('premium-email').value = userData.email;

  document.getElementById('btn-download-pdf').addEventListener('click', (e) => {
    withButtonLoading(e.currentTarget, () =>

  document.getElementById('btn-download-png').addEventListener('click', (e) => {
    withButtonLoading(e.currentTarget, () =>
      exportToPng(document.getElementById('preview-premium').querySelector('.resume'), fileName('profissional', 'png')));
  });
  document.getElementById('btn-send-email').addEventListener('click', (e) => {
    const email = document.getElementById('premium-email').value.trim();
    if (!email) { alert('Informe um e-mail válido.'); return; }
    // Ponto de integração: enviar `email` + PDF gerado para um backend
    // (ex.: POST /api/send-resume) que dispare o envio via SendGrid, SES etc.
    const btn = e.currentTarget;
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Enviando...';
    setTimeout(() => {
      btn.textContent = 'Enviado ✓';
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
    }, 900);
  });

  function fileName(variant, ext) {
    return `curriculo-${slug(userData.nome)}-${variant}.${ext}`;
  }
  function slug(str) {
    return (str || 'curriculo').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'curriculo';
  }

  // Mostra um estado de carregamento no botão enquanto a exportação (assíncrona) roda
  async function withButtonLoading(btn, fn) {
    btn.classList.add('btn--loading');
    btn.disabled = true;
    try { await fn(); }
    finally { btn.classList.remove('btn--loading'); btn.disabled = false; }
  }

  // Clona o nó do currículo em tamanho real (sem escala de preview) dentro da
  // área oculta #export-root, para que a exportação capture o documento
  // inteiro, sem cortes e na resolução nativa.
  function cloneForExport(node) {
    dom.exportRoot.innerHTML = '';
    const clone = node.cloneNode(true);
    clone.style.transform = 'none';
    dom.exportRoot.appendChild(clone);
    return clone;
  }

  async function exportToPdf(node, filename) {
    if (!node || typeof html2canvas === 'undefined') { alert('Não foi possível gerar o PDF agora. Verifique sua conexão.'); return; }
    const clone = cloneForExport(node);
    const canvas = await html2canvas(clone, { scale: CONFIG.exportScale, useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'px', format: [canvas.width, canvas.height] });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    pdf.save(filename);
    dom.exportRoot.innerHTML = '';
  }

  async function exportToPng(node, filename) {
    if (!node || typeof html2canvas === 'undefined') { alert('Não foi possível gerar a imagem agora. Verifique sua conexão.'); return; }
    const clone = cloneForExport(node);
    const canvas = await html2canvas(clone, { scale: CONFIG.exportScale, useCORS: true });
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
    dom.exportRoot.innerHTML = '';
  }


  /* ===============================================================
     INICIALIZAÇÃO
     =============================================================== */
  goToStep(1);

})();
</script>
